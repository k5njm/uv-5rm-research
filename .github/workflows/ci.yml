name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release gate (shipped .BF and .app files)
        run: python3 -I firmware/tools/verify_release.py
      - name: Boot logo / tune tools against a fake radio
        run: |
          pip install pillow
          python3 firmware/tests/test_boot_logo_tune_tools.py
      - name: Host simulator (existing apps)
        working-directory: firmware/source-changes/simulator
        run: |
          cargo build --release
          mkdir -p /tmp/simout
          ./target/release/sim /tmp/simout ../../skull_logo.rgb565
      - name: App unit tests (logic.rs tests run through the simulator crate)
        working-directory: firmware/source-changes/simulator
        run: cargo test --release
      - name: Scenario + golden-frame tests
        working-directory: firmware/source-changes/simulator
        run: |
          export OUT=/tmp/scenario-frames
          ./run_scenarios.sh
          for st in d74 proxx ft5d; do STYLE=$st ./run_scenarios.sh; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-frames
          path: /tmp/scenario-frames
      - name: HIL pipeline (synthetic camera, fake injector)
        run: |
          pip install pillow numpy
          python3 hil/test_hil.py
      - name: HAM TOOLS overlay builds for the target and fits the 8 KB arena
        working-directory: firmware/firmware-source
        run: |
          sudo apt-get install -y llvm >/dev/null
          mkdir -p /tmp/shim /tmp/out
          for t in objcopy nm size; do ln -sf "$(command -v llvm-$t || command -v llvm-$t-*)" /tmp/shim/rust-$t; done
          for st in classic d74 proxx ft5d; do
            f=""; [ $st != classic ] && f="style-$st"
            MKAPP_FEATURES=$f PATH=/tmp/shim:$PATH python3 tools/mkapp.py apps/hamtools --name "HAM TOOLS" -o /tmp/out/hamtools-$st.app
          done
      - name: Core firmware builds (default YP07/FD6818B and bk4819 variants) and fits 60 KB
        working-directory: firmware
        run: |
          mkdir -p /tmp/out
          cargo build --release --manifest-path firmware-source/Cargo.toml --config firmware-source/.cargo/config.toml --target-dir /tmp/t/fw
          python3 -I source-changes/elf2bin.py /tmp/t/fw/thumbv7em-none-eabi/release/bf5rh-fw /tmp/out/fw-default.bin
          cargo build --release --features bk4819 --manifest-path firmware-source/Cargo.toml --config firmware-source/.cargo/config.toml --target-dir /tmp/t/fwbk
          python3 -I source-changes/elf2bin.py /tmp/t/fwbk/thumbv7em-none-eabi/release/bf5rh-fw /tmp/out/fw-bk4819.bin
          sha256sum /tmp/out/*.bin | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: /tmp/out/*.bin
  hab-apps:
    # aprs/horus/rs41 do not compile yet (see AUDIT.md). The failure is reported as a
    # warning annotation, not a red check. Remove continue-on-error once they build.
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [aprs, horus, rs41] }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.app }} (known-broken, non-blocking)
        working-directory: firmware/firmware-source/apps/${{ matrix.app }}
        continue-on-error: true
        run: |
          if ! cargo build --release; then
            echo "::warning title=${{ matrix.app }} does not compile::Known issue tracked in AUDIT.md"
          fi
