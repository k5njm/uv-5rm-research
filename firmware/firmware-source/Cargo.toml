[workspace]
members = ["abi"]

[package]
name = "bf5rh-fw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bf5rh-fw"
test = false
bench = false

[features]
default = []
# 5RHBK board (BK4819 RF chip): Baofeng's BK init values instead of the
# BK4829 tuning used on the 5RHNRFB/FD6818 board, plus a HICK clock fallback.
bk4819 = []

[dependencies]
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["device"] }
panic-halt = "0.2"
at32f421-pac = { path = "at32f421-pac", features = ["rt"] }
embedded-graphics = "0.8"
bf5rh-abi = { path = "abi" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
overflow-checks = false
