[workspace]

[package]
name = "sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim"
path = "main.rs"

[features]
style-d74 = []
style-proxx = []
style-ft5d = []
# Settings app: one simulator build per segment (the real app is three crates with different features)
g_radio = []
g_audio = []
g_disp = []
g_keys = []
g_ani = []
g_system = []
settings-menu = ["g_audio", "g_disp", "g_keys", "g_ani"]
settings-radio = ["g_radio"]
settings-system = ["g_system"]

[dependencies]
bf5rh-abi = { path = "../../firmware-source/abi" }
embedded-graphics = "0.8"
